services:
  - type: web
    name: allora
    runtime: static
    buildCommand: npm install -g bun && bun install --frozen-lockfile && bun run build
    staticPublishPath: ./dist
    headers:
      - path: /media/*
        name: Cache-Control
        value: public, max-age=604800
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
